name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Schemas match models
        run: uv run glow schema export --check
      - name: Tests
        run: uv run pytest
      - name: Types module coverage
        run: uv run pytest tests/test_types.py --cov=glow.types --cov-fail-under=100
      - name: Toolpack manifests lint
        run: uv run glow toolpack lint toolpacks/*/manifest.yaml
      - name: Registry lock matches manifests
        run: uv run glow toolpack lock --check
