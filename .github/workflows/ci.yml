name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Schemas match models
        run: uv run glow schema export --check
      - name: Tests
        run: uv run pytest
      - name: Types module coverage
        run: uv run pytest tests/test_types.py --cov=glow.types --cov-fail-under=100
      - name: Toolpack manifests lint
        run: uv run glow toolpack lint toolpacks/*/manifest.yaml
      - name: Registry lock matches manifests
        run: |
          uv run glow toolpack lock --check
          uv run glow toolpack lock --check --root tests/runner/fake/toolpacks
      - name: Plan the examples
        run: |
          uv run glow plan examples/sst-ingest.yaml
          uv run glow plan examples/minimal-if-script.yaml
          uv run glow plan examples/sentinel2-vancouver-island.yaml
      - name: Compile the examples
        run: |
          uv run glow compile examples/sst-ingest.yaml --allow-local-images -o "$RUNNER_TEMP/sst-ingest.yaml"
          uv run glow compile examples/minimal-if-script.yaml --allow-local-images -o "$RUNNER_TEMP/minimal-if-script.yaml"
          uv run glow compile examples/sentinel2-vancouver-island.yaml --allow-local-images -o "$RUNNER_TEMP/sentinel2-vancouver-island.yaml"
      - name: Install the argo CLI
        env:
          ARGO_VERSION: v4.1.4
          ARGO_SHA256: 2c8ef41d53593f2ee64d85fb69b631c89a0fc2c57e6ce011422caa525a97ec58
        run: |
          mkdir -p "$RUNNER_TEMP/argo"
          curl -fsSL -o "$RUNNER_TEMP/argo/argo.gz" \
            "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          echo "${ARGO_SHA256}  $RUNNER_TEMP/argo/argo.gz" | sha256sum -c -
          gunzip "$RUNNER_TEMP/argo/argo.gz"
          chmod +x "$RUNNER_TEMP/argo/argo"
          echo "$RUNNER_TEMP/argo" >> "$GITHUB_PATH"
      - name: Lint the golden files with argo
        run: argo lint --offline tests/compile/golden/*.yaml

  glow-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: glow-exec
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: glow-exec/go.mod
          cache-dependency-path: glow-exec/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./... && go vet -tags s3 ./...
      - name: Build
        run: go build ./...
      - name: Tests
        run: go test ./...
      - name: Docker image
        run: docker build -t glow-exec:ci .
      - name: Static binary under 40 MB
        run: |
          id=$(docker create glow-exec:ci)
          docker cp "$id:/glow-exec" "$RUNNER_TEMP/glow-exec"
          docker rm "$id"
          file "$RUNNER_TEMP/glow-exec" | tee /dev/stderr | grep -q "statically linked"
          size=$(stat -c %s "$RUNNER_TEMP/glow-exec")
          echo "glow-exec is $size bytes"
          test "$size" -lt $((40 * 1024 * 1024))

  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Build glow-exec
        run: docker build -t local/glow-exec:dev glow-exec
      - name: Runner tests in Docker
        env:
          GLOW_RUNNER_TESTS: "1"
        run: uv run pytest tests/runner -m "not integration"
      - name: Engine and sandbox images
        run: |
          docker build -f images/engine/Dockerfile -t local/engine:dev .
          docker build -t local/sandbox:dev images/sandbox
          docker run --rm local/engine:dev --help

  toolpacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Build images
        run: make images
      - name: Wrapper tests inside the images
        run: make images-test
      - name: SST workflow with the local runner
        env:
          GLOW_IMAGE_TESTS: "1"
          GLOW_RUNNER_TESTS: "1"
        run: uv run pytest tests/runner -m integration
