apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: block-outer-step-output-
  namespace: tenant-acme
spec:
  entrypoint: main
  serviceAccountName: glow-runner
  templates:
  - name: main
    dag:
      tasks:
      - name: items
        template: builtin-fs-group
        arguments:
          parameters:
          - name: raw-with
            value: eyJyb290IjoiJHt7IGlucHV0cy5yb290IH19IiwicGF0dGVybiI6Iig/UDxkYXRlPlxcZHs4fSlcXC50aWYkIiwia2V5IjoiZGF0ZSIsIm1lZGlhX3R5cGUiOiJpbWFnZS90aWZmOyBhcHBsaWNhdGlvbj1nZW90aWZmIn0=
          - name: scope
            value: '{"inputs":{"root":{{workflow.parameters.root}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/items
      - name: per-item
        depends: items
        template: per-item-block
        withParam: '{{tasks.items.outputs.parameters.groups}}'
        arguments:
          parameters:
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/per-item/{{item.key}}
          - name: loop-per-item
            value: '{{item}}'
          - name: upstream-items
            value: '{{tasks.items.outputs.parameters.outputs}}'
          - name: task-items-groups
            value: '{{tasks.items.outputs.parameters.groups}}'
  - name: per-item-block
    dag:
      tasks:
      - name: cog
        template: tool-gdal-translate
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgZy5maWxlc1swXS5wYXRoIH19Iiwic3ViZGF0YXNldCI6IiR7eyBzdGVwcy5pdGVtcy5vdXRwdXRzLmdyb3Vwc1swXS5rZXkgfX0ifQ==
          - name: scope
            value: '{"inputs":{"root":{{workflow.parameters.root}}},"g":{{inputs.parameters.loop-per-item}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/cog'
          - name: upstream-items
            value: '{{inputs.parameters.upstream-items}}'
      - name: per-group
        template: per-group-block
        withParam: '{{inputs.parameters.task-items-groups}}'
        arguments:
          parameters:
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/per-group/{{item.key}}'
          - name: loop-per-group
            value: '{{item}}'
          - name: upstream-items
            value: '{{inputs.parameters.upstream-items}}'
    inputs:
      parameters:
      - name: run-prefix
      - name: loop-per-item
      - name: upstream-items
      - name: task-items-groups
    outputs:
      parameters:
      - name: result
        valueFrom:
          parameter: '{{tasks.cog.outputs.parameters.result}}'
  - name: per-group-block
    dag:
      tasks:
      - name: pair
        template: tool-gdal-translate
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgb3RoZXIuZmlsZXNbMF0ucGF0aCB9fSIsInN1YmRhdGFzZXQiOiIke3sgc3RlcHMuaXRlbXMub3V0cHV0cy5ncm91cHNbMF0ua2V5IH19In0=
          - name: scope
            value: '{"inputs":{"root":{{workflow.parameters.root}}},"other":{{inputs.parameters.loop-per-group}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/pair'
          - name: upstream-items
            value: '{{inputs.parameters.upstream-items}}'
    inputs:
      parameters:
      - name: run-prefix
      - name: loop-per-group
      - name: upstream-items
    outputs:
      parameters:
      - name: pairs
        valueFrom:
          parameter: '{{tasks.pair.outputs.parameters.result}}'
  - name: builtin-fs-group
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: ghcr.io/sparkgeo/glow-engine:test
      args:
      - glow-builtin
      - fs.group
      command:
      - /glow/exec
      - run
      - --tool
      - fs.group@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: groups
        valueFrom:
          default: 'null'
          path: /work/outputs/groups.json
  - name: tool-gdal-translate
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/gdal:dev
      args:
      - gdal_translate_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.translate@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      - name: GLOW_UPSTREAM_items
        value: '{{inputs.parameters.upstream-items}}'
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
      - name: upstream-items
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: result
        valueFrom:
          default: 'null'
          path: /work/outputs/result.json
  arguments:
    parameters:
    - name: root
