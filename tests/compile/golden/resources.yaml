apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: resources-
  namespace: tenant-acme
spec:
  entrypoint: main
  serviceAccountName: glow-runner
  templates:
  - name: main
    dag:
      tasks:
      - name: big
        template: big-fanout
      - name: small
        template: tool-gdal-translate-small
        withParam: '{{workflow.parameters.sources}}'
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgc291cmNlIH19IiwiZm9ybWF0IjoiUE5HIn0=
          - name: scope
            value: '{"inputs":{"sources":{{workflow.parameters.sources}}},"source":{{item}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/small/{{item}}
  - name: big-fanout
    parallelism: 3
    dag:
      tasks:
      - name: big
        template: tool-gdal-translate
        withParam: '{{workflow.parameters.sources}}'
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgc291cmNlIH19IiwiZm9ybWF0IjoiQ09HIn0=
          - name: scope
            value: '{"inputs":{"sources":{{workflow.parameters.sources}}},"source":{{item}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/big/{{item}}
    outputs:
      parameters:
      - name: result
        valueFrom:
          parameter: '{{tasks.big.outputs.parameters.result}}'
  - name: tool-gdal-translate
    activeDeadlineSeconds: 5400
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/gdal:dev
      args:
      - gdal_translate_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.translate@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: auto
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      resources:
        limits:
          cpu: '4'
          memory: 8Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '2'
          memory: 8Gi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: result
        valueFrom:
          default: 'null'
          path: /work/outputs/result.json
    retryStrategy:
      limit: '2'
      retryPolicy: OnError
  - name: tool-gdal-translate-small
    activeDeadlineSeconds: 600
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/gdal:dev
      args:
      - gdal_translate_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.translate@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: result
        valueFrom:
          default: 'null'
          path: /work/outputs/result.json
  arguments:
    parameters:
    - name: sources
