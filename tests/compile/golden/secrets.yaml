apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: secrets-
  namespace: tenant-acme
spec:
  entrypoint: main
  serviceAccountName: glow-runner
  templates:
  - name: main
    dag:
      tasks:
      - name: cog
        template: tool-gdal-translate
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgaW5wdXRzLnNvdXJjZSB9fSJ9
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/cog
      - name: info
        depends: cog
        template: tool-gdal-info
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgc3RlcHMuY29nLm91dHB1dHMucmVzdWx0IH19In0=
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/info
          - name: upstream-cog
            value: '{{tasks.cog.outputs.parameters.outputs}}'
  - name: tool-gdal-translate
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    - name: secret-0
      secret:
        secretName: aws-creds
    - name: secret-1
      secret:
        secretName: api-token
    container:
      image: local/gdal:dev
      args:
      - gdal_translate_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.translate@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      - name: secret-0
        mountPath: /secrets/aws-creds
        readOnly: true
      - name: secret-1
        mountPath: /secrets/api-token
        readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: result
        valueFrom:
          default: 'null'
          path: /work/outputs/result.json
  - name: tool-gdal-info
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/gdal:dev
      args:
      - gdalinfo_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.info@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      - name: GLOW_UPSTREAM_cog
        value: '{{inputs.parameters.upstream-cog}}'
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
      - name: upstream-cog
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: info
        valueFrom:
          default: 'null'
          path: /work/outputs/info.json
  arguments:
    parameters:
    - name: source
