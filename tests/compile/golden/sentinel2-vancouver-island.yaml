apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: sentinel2-vancouver-island-
  namespace: tenant-acme
spec:
  entrypoint: main
  serviceAccountName: glow-runner
  templates:
  - name: main
    dag:
      tasks:
      - name: search
        template: tool-stac-search
        arguments:
          parameters:
          - name: raw-with
            value: eyJjb2xsZWN0aW9ucyI6WyJzZW50aW5lbC0yLWwyYSJdLCJiYm94IjoiJHt7IGlucHV0cy5iYm94IH19IiwiZGF0ZXRpbWUiOiIke3sgaW5wdXRzLmRhdGV0aW1lIH19IiwicXVlcnkiOnsiZW86Y2xvdWRfY292ZXIiOnsibHQiOiIke3sgaW5wdXRzLm1heF9jbG91ZF9jb3ZlciB9fSJ9fSwiYXNzZXRzIjpbInZpc3VhbCJdLCJtYXhfaXRlbXMiOiIke3sgaW5wdXRzLm1heF9pdGVtcyB9fSJ9
          - name: scope
            value: '{"inputs":{"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"bbox":{{workflow.parameters.bbox}},"datetime":{{workflow.parameters.datetime}},"max_cloud_cover":{{workflow.parameters.max_cloud_cover}},"max_items":{{workflow.parameters.max_items}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/search
      - name: per-scene
        depends: search
        template: per-scene-fanout
        arguments:
          parameters:
          - name: task-search-items
            value: '{{tasks.search.outputs.parameters.items}}'
      - name: publish
        depends: per-scene
        template: tool-stac-publish
        arguments:
          parameters:
          - name: raw-with
            value: 
          - name: scope
            value: '{"inputs":{"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"bbox":{{workflow.parameters.bbox}},"datetime":{{workflow.parameters.datetime}},"max_cloud_cover":{{workflow.parameters.max_cloud_cover}},"max_items":{{workflow.parameters.max_items}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/publish
          - name: upstream-per-scene
            value: '{"outputs":{"item":{{tasks.per-scene.outputs.parameters.item}}},"skipped":false}'
  - name: per-scene-fanout
    parallelism: 4
    dag:
      tasks:
      - name: per-scene
        template: per-scene-block
        withParam: '{{inputs.parameters.task-search-items}}'
        arguments:
          parameters:
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/per-scene/{{item}}
          - name: loop-per-scene
            value: '{{item}}'
    inputs:
      parameters:
      - name: task-search-items
    outputs:
      parameters:
      - name: item
        valueFrom:
          parameter: '{{tasks.per-scene.outputs.parameters.item}}'
  - name: per-scene-block
    dag:
      tasks:
      - name: download
        template: tool-stac-download
        arguments:
          parameters:
          - name: raw-with
            value: eyJocmVmIjoiJHt7IHNjZW5lLmFzc2V0cy52aXN1YWwuaHJlZiB9fSJ9
          - name: scope
            value: '{"inputs":{"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"bbox":{{workflow.parameters.bbox}},"datetime":{{workflow.parameters.datetime}},"max_cloud_cover":{{workflow.parameters.max_cloud_cover}},"max_items":{{workflow.parameters.max_items}}},"scene":{{inputs.parameters.loop-per-scene}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/download'
      - name: cog
        depends: download
        template: tool-gdal-translate
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgc3RlcHMuZG93bmxvYWQub3V0cHV0cy5yZXN1bHQgfX0iLCJmb3JtYXQiOiJDT0ciLCJjcmVhdGlvbl9vcHRpb25zIjp7IkNPTVBSRVNTIjoiREVGTEFURSIsIlBSRURJQ1RPUiI6IjIifX0=
          - name: scope
            value: '{"inputs":{"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"bbox":{{workflow.parameters.bbox}},"datetime":{{workflow.parameters.datetime}},"max_cloud_cover":{{workflow.parameters.max_cloud_cover}},"max_items":{{workflow.parameters.max_items}}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/cog'
          - name: upstream-download
            value: '{{tasks.download.outputs.parameters.outputs}}'
      - name: thumb
        depends: cog
        template: tool-gdal-translate-thumb
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgc3RlcHMuY29nLm91dHB1dHMucmVzdWx0IH19IiwiZm9ybWF0IjoiUE5HIiwic2l6ZSI6WzUxMiwwXX0=
          - name: scope
            value: '{"inputs":{"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"bbox":{{workflow.parameters.bbox}},"datetime":{{workflow.parameters.datetime}},"max_cloud_cover":{{workflow.parameters.max_cloud_cover}},"max_items":{{workflow.parameters.max_items}}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/thumb'
          - name: upstream-cog
            value: '{{tasks.cog.outputs.parameters.outputs}}'
      - name: item
        depends: cog && thumb
        template: tool-stac-item
        arguments:
          parameters:
          - name: raw-with
            value: 
          - name: scope
            value: '{"inputs":{"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"bbox":{{workflow.parameters.bbox}},"datetime":{{workflow.parameters.datetime}},"max_cloud_cover":{{workflow.parameters.max_cloud_cover}},"max_items":{{workflow.parameters.max_items}}},"scene":{{inputs.parameters.loop-per-scene}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/item'
          - name: upstream-cog
            value: '{{tasks.cog.outputs.parameters.outputs}}'
          - name: upstream-thumb
            value: '{{tasks.thumb.outputs.parameters.outputs}}'
    inputs:
      parameters:
      - name: run-prefix
      - name: loop-per-scene
    outputs:
      parameters:
      - name: item
        valueFrom:
          parameter: '{{tasks.item.outputs.parameters.item}}'
  - name: tool-stac-search
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
