apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: sst-ingest-
  namespace: tenant-acme
spec:
  entrypoint: main
  serviceAccountName: glow-runner
  templates:
  - name: main
    dag:
      tasks:
      - name: items
        template: builtin-fs-group
        arguments:
          parameters:
          - name: raw-with
            value: eyJyb290IjoiJHt7IGlucHV0cy5zb3VyY2UgfX0iLCJwYXR0ZXJuIjoic3N0Xyg/UDxkYXRlPlxcZHs4fSlcXC5uYyQiLCJrZXkiOiJkYXRlIiwibWVkaWFfdHlwZSI6ImFwcGxpY2F0aW9uL3gtbmV0Y2RmIn0=
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}},"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"color_table":{{workflow.parameters.color_table}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/items
      - name: per-item
        depends: items
        template: per-item-block
        withParam: '{{tasks.items.outputs.parameters.groups}}'
        arguments:
          parameters:
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/per-item/{{item.key}}
          - name: loop-per-item
            value: '{{item}}'
      - name: publish
        depends: per-item
        template: tool-stac-publish
        arguments:
          parameters:
          - name: raw-with
            value: eyJjb2xsZWN0aW9uIjoiJHt7IGlucHV0cy5jb2xsZWN0aW9uIH19IiwiaXRlbXMiOiIke3sgc3RlcHMucGVyX2l0ZW0ub3V0cHV0cy5pdGVtIH19IiwiZGVzdCI6IiR7eyBpbnB1dHMuZGVzdCB9fSJ9
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}},"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"color_table":{{workflow.parameters.color_table}}}}'
          - name: run-prefix
            value: s3://artifact-bucket-acme/runs/{{workflow.uid}}/steps/publish
          - name: upstream-per-item
            value: '{"outputs":{"item":{{tasks.per-item.outputs.parameters.item}}},"skipped":false}'
  - name: per-item-block
    dag:
      tasks:
      - name: cog
        template: tool-gdal-translate
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgZy5maWxlc1swXS5wYXRoIH19Iiwic3ViZGF0YXNldCI6InNlYV9zdXJmYWNlX3RlbXBlcmF0dXJlIiwiZm9ybWF0IjoiQ09HIiwiY3JlYXRpb25fb3B0aW9ucyI6eyJDT01QUkVTUyI6IkRFRkxBVEUiLCJQUkVESUNUT1IiOiIyIn19
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}},"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"color_table":{{workflow.parameters.color_table}}},"g":{{inputs.parameters.loop-per-item}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/cog'
      - name: thumb
        depends: cog
        template: tool-gdal-dem-color-relief
        arguments:
          parameters:
          - name: raw-with
            value: eyJzb3VyY2UiOiIke3sgc3RlcHMuY29nLm91dHB1dHMucmVzdWx0IH19IiwiY29sb3JfdGFibGUiOiIke3sgaW5wdXRzLmNvbG9yX3RhYmxlIH19Iiwic2l6ZSI6WzYwMCwwXSwiZm9ybWF0IjoiUE5HIn0=
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}},"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"color_table":{{workflow.parameters.color_table}}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/thumb'
          - name: upstream-cog
            value: '{{tasks.cog.outputs.parameters.outputs}}'
      - name: render
        template: tool-prescient-render-from-color-table
        arguments:
          parameters:
          - name: raw-with
            value: eyJjb2xvcl90YWJsZSI6IiR7eyBpbnB1dHMuY29sb3JfdGFibGUgfX0iLCJhc3NldCI6ImRhdGEiLCJuYW1lIjoic3N0In0=
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}},"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"color_table":{{workflow.parameters.color_table}}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/render'
      - name: item
        depends: cog && thumb && render
        template: tool-stac-item
        arguments:
          parameters:
          - name: raw-with
            value: 
          - name: scope
            value: '{"inputs":{"source":{{workflow.parameters.source}},"dest":{{workflow.parameters.dest}},"collection":{{workflow.parameters.collection}},"color_table":{{workflow.parameters.color_table}}},"g":{{inputs.parameters.loop-per-item}}}'
          - name: run-prefix
            value: '{{inputs.parameters.run-prefix}}/item'
          - name: upstream-cog
            value: '{{tasks.cog.outputs.parameters.outputs}}'
          - name: upstream-thumb
            value: '{{tasks.thumb.outputs.parameters.outputs}}'
          - name: upstream-render
            value: '{{tasks.render.outputs.parameters.outputs}}'
    inputs:
      parameters:
      - name: run-prefix
      - name: loop-per-item
    outputs:
      parameters:
      - name: item
        valueFrom:
          parameter: '{{tasks.item.outputs.parameters.item}}'
  - name: builtin-fs-group
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: ghcr.io/sparkgeo/glow-engine:test
      args:
      - glow-builtin
      - fs.group
      command:
      - /glow/exec
      - run
      - --tool
      - fs.group@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: groups
        valueFrom:
          default: 'null'
          path: /work/outputs/groups.json
  - name: tool-gdal-translate
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/gdal:dev
      args:
      - gdal_translate_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.translate@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: result
        valueFrom:
          default: 'null'
          path: /work/outputs/result.json
  - name: tool-gdal-dem-color-relief
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/gdal:dev
      args:
      - gdaldem_color_relief_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - gdal.dem.color_relief@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      - name: GLOW_UPSTREAM_cog
        value: '{{inputs.parameters.upstream-cog}}'
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
      - name: upstream-cog
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: result
        valueFrom:
          default: 'null'
          path: /work/outputs/result.json
  - name: tool-prescient-render-from-color-table
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    volumes:
    - name: glow
      emptyDir: {}
    - name: work
      emptyDir:
        sizeLimit: 20Gi
    container:
      image: local/prescient:dev
      args:
      - render_from_color_table_wrapper
      command:
      - /glow/exec
      - run
      - --tool
      - prescient.render_from_color_table@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
        value: copy
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
    outputs:
      parameters:
      - name: outputs
        valueFrom:
          path: /work/outputs.resolved.json
      - name: renders
        valueFrom:
          default: 'null'
          path: /work/outputs/renders.json
  - name: tool-stac-item
    initContainers:
    - name: glow-init
      image: ghcr.io/sparkgeo/glow-exec:test
      command:
      - /glow-exec
      - install
      - /glow/exec
      volumeMounts:
      - name: glow
        mountPath: /glow
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
