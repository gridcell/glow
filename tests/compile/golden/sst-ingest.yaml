      - name: GLOW_UPSTREAM_cog
        value: '{{inputs.parameters.upstream-cog}}'
      - name: GLOW_UPSTREAM_thumb
        value: '{{inputs.parameters.upstream-thumb}}'
      - name: GLOW_UPSTREAM_render
        value: '{{inputs.parameters.upstream-render}}'
      volumeMounts:
      - name: glow
        mountPath: /glow
        readOnly: true
      - name: work
        mountPath: /work
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    inputs:
      parameters:
      - name: raw-with
      - name: scope
      - name: let
        default: ''
      - name: if
        default: ''
      - name: run-prefix
      - name: upstream-cog
