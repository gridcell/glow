      - stac.item@1
      - --
      env:
      - name: GLOW_RAW_WITH
        value: '{{inputs.parameters.raw-with}}'
      - name: GLOW_MANIFEST
        value: 
      - name: GLOW_SCOPE
        value: '{{inputs.parameters.scope}}'
      - name: GLOW_LET
        value: '{{inputs.parameters.let}}'
      - name: GLOW_IF
        value: '{{inputs.parameters.if}}'
      - name: GLOW_RUN_PREFIX
        value: '{{inputs.parameters.run-prefix}}'
      - name: GLOW_STAGING
