name: block-member-outside
inputs:
  scenes: { type: array }
steps:
  - id: per_scene
    for_each: ${{ inputs.scenes }}
    as: scene
    steps:
      - id: cog
        uses: gdal.translate@1
        with:
          source: ${{ scene.path }}
    outputs:
      cogs: ${{ steps.cog.outputs.result }}
  - id: info
    uses: gdal.info@1
    with:
      source: ${{ steps.cog.outputs.result }}
