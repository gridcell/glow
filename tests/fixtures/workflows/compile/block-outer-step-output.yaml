# Block members use an output of a step outside the block, one and two
# levels down, and a nested for_each iterates over it.
name: block-outer-step-output
inputs:
  root: { type: uri }
steps:
  - id: items
    uses: fs.group
    with:
      root: ${{ inputs.root }}
      pattern: "(?P<date>\\d{8})\\.tif$"
      key: date
      media_type: "image/tiff; application=geotiff"
  - id: per_item
    for_each: ${{ steps.items.outputs.groups }}
    as: g
    steps:
      - id: cog
        uses: gdal.translate@1
        with:
          source: ${{ g.files[0].path }}
          subdataset: ${{ steps.items.outputs.groups[0].key }}
      - id: per_group
        for_each: ${{ steps.items.outputs.groups }}
        as: other
        steps:
          - id: pair
            uses: gdal.translate@1
            with:
              source: ${{ other.files[0].path }}
              subdataset: ${{ steps.items.outputs.groups[0].key }}
        outputs:
          pairs: ${{ steps.pair.outputs.result }}
    outputs:
      result: ${{ steps.cog.outputs.result }}
