# Secrets are mounted on the template of the step that declares them only.
name: secrets
inputs:
  source: { type: file, media_type: "image/tiff; application=geotiff" }
steps:
  - id: cog
    uses: gdal.translate@1
    secrets: [aws-creds, api-token]
    with:
      source: ${{ inputs.source }}
  - id: info
    uses: gdal.info@1
    with:
      source: ${{ steps.cog.outputs.result }}
